kontinu: berkesinambungan; berkelanjutan; terus-menerus.
osilasi: gerakan kiri ke kanan atau atas ke bawah atau depan ke belakang; ayunan; getaran
sekan: garis lurus yang mempunyai satu titik persekutuan atau lebih dengan suatu lengkungan
tangen: garis yang mengenai satu titik pada keliling bulatan
gradien: kecepatan perubahan suatu variabel dengan mengikuti koordinat ruang
perkalian sekawan: teknik perkalian
linier: garis lurus
binomial: terdiri atas dua kata atau dua unsur; gabungan yang dapat dibagi dua